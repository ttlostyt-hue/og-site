<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG Fortnite</title>
  <style>body{font-family:system-ui;background:#0b0f1a;color:#e8ecf5;margin:0;display:grid;place-items:center;height:100vh}
  .card{background:#141a2b;padding:2rem 2.5rem;border-radius:16px;box-shadow:0 10px 40px #0008;text-align:center}
  h1{margin:0 0 .5rem}#st{color:#7CFFB2;font-family:monospace}</style>
</head>
<body>
  <div class="card">
    <h1>OG Fortnite 🎮</h1>
    <p>Backend status: <span id="st">checking…</span></p>
  </div>
  <script>
    fetch('/api/status').then(r=>r.json())
      .then(d=>document.getElementById('st').textContent = d.ok ? 'online ('+d.edge+')' : 'down')
      .catch(()=>document.getElementById('st').textContent = 'error');
  </script>
</body>
</html>
